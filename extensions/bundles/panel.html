<meta name="viewport" content="width=device-width, initial-scale=1">
<title></title>
<style>
  :root { color-scheme:light; --bg:#f7f8fa; --surface:#edf0f4; --ink:#232a36; --muted:#526074; --line:#a9b3c2; --focus:#265b9f; --chip-radius:3px; font:13px system-ui,sans-serif; }
  :root[data-appearance=dark] { color-scheme:dark; --bg:#1d2430; --surface:#252f3d; --ink:#e0e7f1; --muted:#b2bed0; --line:#67768b; --focus:#83b6ef; }
  * { box-sizing:border-box; border-radius:0; }
  html,body { background:var(--bg); color:var(--ink); }
  body { margin:0; padding:12px; overflow-wrap:anywhere; }
  [hidden] { display:none !important; }
  header,.row,.scopes { display:flex; align-items:center; flex-wrap:wrap; gap:8px; }
  header { margin-bottom:8px; }
  header>div { flex-basis:100%; }
  h1,h2,h3,p { margin:0; }
  h1,h2 { font-size:13px; font-weight:600; }
  h3 { font-size:12px; }
  header h1 { flex:1; }
  button,select { min-height:30px; padding:5px 8px; border:1px solid var(--line); background:var(--surface); color:inherit; font:inherit; cursor:pointer; }
  button:focus-visible,select:focus-visible,input:focus-visible { outline:2px solid var(--focus); outline-offset:2px; }
  button:disabled,button[aria-disabled=true] { opacity:.6; cursor:default; }
  .muted,dt { color:var(--muted); }
  p { line-height:1.5; }
  #catalog,#notice,#preview { margin-bottom:10px; }
  #notice:empty { display:none; }
  #notice { padding:8px; border:1px solid var(--line); }
  .integration { border:1px solid var(--line); margin-bottom:10px; }
  .integration-heading { display:flex; align-items:center; gap:8px; padding-inline-end:8px; }
  .integration-heading h2 { flex:1; min-width:0; }
  .docs-address { direction:ltr; unicode-bidi:isolate; text-align:start; }
  .docs-status { margin:0 10px 10px; }
  .disclosure { display:flex; gap:8px; flex-wrap:wrap; align-items:center; text-align:start; border:0; width:100%; padding:10px; background:var(--bg); }
  .disclosure::before { content:'▸'; }
  .disclosure[aria-expanded=true]::before { content:'▾'; }
  .name { flex:1; min-width:120px; }
  .badge-shape { border:1px solid var(--line); border-radius:var(--chip-radius); padding:1px 5px; font-size:11px; font-weight:400; }
  .body { border-top:1px solid var(--line); padding:10px; display:grid; gap:14px; }
  .group { display:grid; gap:8px; }
  dl { display:grid; grid-template-columns:minmax(80px,auto) minmax(0,1fr); gap:4px 10px; margin:0; }
  dd { margin:0; }
  .scope { display:flex; flex-wrap:wrap; gap:8px; align-items:center; padding:8px; background:var(--surface); }
  .scope label { flex:1; display:flex; align-items:center; gap:6px; min-width:140px; }
  input { accent-color:var(--focus); }
  .offers { display:grid; gap:8px; }
  .offer { display:grid; gap:6px; border-inline-start:2px solid var(--line); padding-inline-start:8px; }
  .offer button { justify-self:start; }
  @media(max-width:359px) { body { padding:8px; } dl { grid-template-columns:1fr; } dd { margin-bottom:4px; } .scope { align-items:stretch; } }
</style>

<script>
(() => {
  const $=id=>document.getElementById(id), api=window.codenomad, T=JSON.parse($('i18n').textContent);

  let locale='en', context, catalog, snapshot, epoch=0, running=false, dirty=false, locked=false, noticeKey, docsPending=false, docsAfter=0;
  const t=(key,args={})=>(T[locale]?.[key]??T.en[key]??T.en.unknown).replace(/\{(\w+)\}/g,(_,key)=>String(args[key]??''));
  const node=(tag,cls,text)=>{const value=document.createElement(tag);if(cls)value.className=cls;if(text!==undefined)value.textContent=text;return value;};

  const pair=(list)=>{const dt=node('dt'),dd=node('dd');list.append(dt,dd);return {set:(key,value)=>{dt.textContent=t(key);dd.textContent=value??t('unknown');}};};
  const announce=key=>{noticeKey=key;$('notice').textContent=t(key);};
  function pending(value) {
    locked=value;
    for(const control of document.querySelectorAll('[data-manage]')) control.setAttribute('aria-disabled',String(value));
  }
  function preserveFocus(trigger,row) {
    if(!document.hasFocus() || !row || !trigger || (document.activeElement!==trigger && document.activeElement!==document.body))return;
    if(trigger.isConnected && trigger.getClientRects().length && !trigger.disabled) {
      if(document.activeElement!==trigger)trigger.focus();
    } else (row.disclosure.isConnected ? row.disclosure : $('refresh')).focus();
  }
  function fallback(trigger,row) {
    // The native frame restores the exact surviving trigger. Handle hidden/removed origins only.
    const mine=epoch;
    setTimeout(()=>{
      if(mine!==epoch)return;
      if(trigger?.isConnected && trigger.getClientRects().length && !trigger.disabled)return;
      (row?.disclosure.isConnected ? row.disclosure : $('refresh')).focus();
    },32);
  }
  async function manage(row,trigger,method,input) {
    if(locked || !context?.sessionId)return;
    pending(true);
    const mine=epoch;
    try {
      const result=await api.bundles[method](input);
      if(mine!==epoch)return;
      if(result?.outcome==='confirming' && typeof result.requestID==='string') {
        requests.set(result.requestID,{trigger,row});announce('confirming');
      } else {pending(false);announce(result?.outcome==='busy'?'busy':'invalid');}
    } catch {if(mine===epoch){pending(false);announce('requestFailed');}}
  }
  function action(parent,row,key,method,input) {
    const value=button(parent,key,trigger=>manage(row,trigger,method,input()));
    value.dataset.manage='';return value;
  }
  function docsStatus(row,key) {row.docKey=key;row.docGap.hidden=false;row.docGap.textContent=t(key);}
  async function openDocs(row) {
    if(docsPending || Date.now()<docsAfter){docsStatus(row,'docsBusy');return;}
    if(typeof api?.bundles?.openDocs!=='function'){docsStatus(row,'docsUnavailable');return;}
    const mine=epoch;docsPending=true;docsAfter=Date.now()+1000;
    for(const item of rows.values())item.docAction.setAttribute('aria-disabled','true');
    try {
      const result=await api.bundles.openDocs({integration:row.entry.id});
      if(mine!==epoch || rows.get(row.entry.id)!==row)return;
      const key=result && Object.keys(result).length===1 && ['requested','unavailable','busy','invalid'].includes(result.outcome) && {requested:'docsRequested',unavailable:'docsUnavailable',busy:'docsBusy',invalid:'docsInvalid'}[result.outcome];
      docsStatus(row,key||'docsUnavailable');
    } catch(error) {if(mine===epoch && rows.get(row.entry.id)===row)docsStatus(row,error?.message==='busy'?'docsBusy':'docsFailed');}
    finally {if(mine===epoch){docsPending=false;for(const item of rows.values())item.docAction.setAttribute('aria-disabled','false');}}
  }
  function create(entry) {
    const section=node('section','integration'), h=node('h2'), row={entry,section,open:false,offers:new Map()};
    row.disclosure=button(h,'disclosure',()=>{
      row.open=!row.open;disclose(row);
      if(row.open && row.entry.family==='native')void refresh();
    });
    row.disclosure.className='disclosure';row.disclosure.id='title-'+entry.id;
    row.name=node('span','name');row.family=node('span','badge-shape');row.version=node('span','muted');row.badge=node('span','badge-shape');
    row.disclosure.append(row.name,row.family,row.version,row.badge);
    row.body=node('div','body');row.body.id='body-'+entry.id;row.body.setAttribute('role','region');row.body.setAttribute('aria-labelledby',row.disclosure.id);
    const heading=node('div','integration-heading');heading.append(h);row.docAction=button(heading,'docs',()=>void openDocs(row));
    row.disclosure.setAttribute('aria-controls',row.body.id);section.append(heading,row.body);
    row.description=node('p');row.nonAffiliation=node('p','muted');row.docTitle=node('h3');row.docs=node('p','muted');row.docHelp=node('p','muted');row.docGap=node('p','muted docs-status');row.docGap.hidden=true;
    row.docs.classList.add('docs-address');row.docs.dir='ltr';row.docGap.setAttribute('role','status');row.docGap.setAttribute('aria-live','polite');row.docGap.setAttribute('aria-atomic','true');
    section.insertBefore(row.docGap,row.body);row.body.append(row.description,row.nonAffiliation,row.docTitle,row.docs,row.docHelp);
    const plugin=node('div','group');row.pluginTitle=node('h3');row.pluginList=node('dl');
    row.versionPair=pair(row.pluginList);row.declarationPair=pair(row.pluginList);row.runtimePair=pair(row.pluginList);row.configPair=pair(row.pluginList);row.effectivePair=pair(row.pluginList);row.rpcPair=pair(row.pluginList);
    row.progressHelp=node('p','muted');
    row.updateNote=node('p');row.globalOnly=node('p','muted');row.scopes=node('div','group');row.scopeControls=[];
    row.installArea=node('div','row');row.installLabel=node('label');row.installScope=node('select');row.installScope.id='scope-'+entry.id;
    row.installLabel.htmlFor=row.installScope.id;row.installArea.append(row.installLabel,row.installScope);
    for(const scope of entry.family==='native'?['global']:['global','project']){const option=node('option');option.value=scope;row.installScope.append(option);}
    row.install=action(row.installArea,row,'install','request',()=>({action:'install',integration:entry.id,scope:row.installScope.value}));
    for(const scope of ['global','project']) {
      const box=node('div','scope'),label=node('label'),check=node('input'),text=node('span');check.type='checkbox';
      check.onchange=()=>{const state=row.state?.activation[scope]??'default';check.checked=state==='enabled';check.indeterminate=state==='default';
        if(!locked)void manage(row,check,'setActive',{integration:entry.id,scope,enabled:state!=='enabled'});};
      check.dataset.manage='';label.append(check,text);box.append(label);
      const update=action(box,row,'update','request',()=>({action:'update',integration:entry.id,scope}));
      const remove=action(box,row,'remove','request',()=>({action:'remove',integration:entry.id,scope}));
      row.scopeControls.push({scope,box,check,text,update,remove});row.scopes.append(box);
    }
    plugin.append(row.pluginTitle,row.pluginList,row.progressHelp,row.updateNote,row.globalOnly,row.installArea,row.scopes);row.body.append(plugin);
    row.app=node('div','group');row.appTitle=node('h3');row.hostList=node('dl');
    row.hostPair=pair(row.hostList);row.partPair=pair(row.hostList);row.rangePair=pair(row.hostList);row.appVersionPair=pair(row.hostList);
    row.installHost=action(row.app,row,'installHost','installHost',()=>({integration:entry.id}));row.machine=node('p','muted');row.openApp=node('p','muted');
    row.app.prepend(row.appTitle,row.hostList);row.app.append(row.machine,row.openApp);row.body.append(row.app);
    const connection=node('div','group');row.connectionTitle=node('h3');row.connection=node('p');row.offersHint=node('p','muted');row.detachGap=node('p','muted');row.offersList=node('div','offers');
    row.requirement=node('p','muted');row.catalogStatus=node('p','muted');row.legacy=node('p','muted');
    connection.append(row.connectionTitle,row.connection,row.requirement,row.offersHint,row.offersList,row.detachGap,row.legacy,row.catalogStatus);row.body.append(connection);
    return row;
  }
  function disclose(row) {row.disclosure.setAttribute('aria-expanded',String(row.open));row.body.hidden=!row.open;}
  function stateKey(state) {
    if(!state)return 'unknown';
    if(state.activation.effective==='disabled')return 'disabled';
    const plugin=state.plugin;
    if(plugin?.runtime==='failed')return 'failed';
    if(plugin?.runtime==='unknown')return 'unknown';
    if(plugin?.runtime==='unloaded')return plugin.declared
      ?(state.activation.effective==='enabled'?plugin.progress:undefined)??'inactive':'absent';
    if(!plugin)return 'unknown';
    if(state.state!=='ok')return state.state;
    if(state.family==='native') {
      if(state.attachment.state==='attached')return 'attached';
      const host=state.status?.host?.state;
      if(host && host!=='ok')return host;
      if((state.status?.connection?.offers??0)>0)return 'available';
    }
    if(state.family!=='native' && state.status?.connection?.state)return state.status.connection.state==='none'?'notAvailable':state.status.connection.state;
    return 'ok';
  }
  function renderRow(row,entry,state) {
    row.entry=entry;row.state=state;
    const native=entry.family==='native',key=stateKey(state),host=state?.status?.host,rule=scope=>state?.activation[scope]??'default';
    row.name.textContent=entry.displayName;row.family.textContent=t(entry.family);row.version.textContent=state?.version??(state?.plugin?.declared===false && state.plugin.runtime==='unloaded'?t('notInstalled'):t('versionUnknown'));
    row.badge.textContent=key==='absent' && state?.plugin?.runtime==='active' && host?.state==='absent'?t('application')+' · '+t(key):t(key);row.description.textContent=entry.summary[locale]??entry.summary.en;
    row.nonAffiliation.textContent=t('nonAffiliation');row.docTitle.textContent=t('docs');row.docs.textContent=entry.docs;row.docHelp.textContent=t('docsGap');if(row.docKey)row.docGap.textContent=t(row.docKey);
    row.docAction.textContent=t('docs');row.docAction.setAttribute('aria-label',t('docs')+' · '+entry.displayName);row.docAction.setAttribute('aria-disabled',String(docsPending));
    row.pluginTitle.textContent=t('plugin');row.versionPair.set('version',row.version.textContent);
    row.declarationPair.set('declaration',t(state?.plugin?(state.plugin.declared?'declared':'notDeclared'):'unknown'));
    row.runtimePair.set('runtime',t(state?.plugin?.runtime==='active'?'loaded':state?.plugin?.runtime??'unknown'));
    row.rpcPair.set('rpcStatus',t(state?.state??'unknown'));
    row.progressHelp.textContent=t('unconfirmedHelp');row.progressHelp.hidden=key!=='unconfirmed';

    row.installHost.textContent=t(host?.state==='outdated'?'updateHost':'installHost');row.machine.textContent=t('machine');
    row.openApp.hidden=host?.state!=='unknown' && !!host;row.openApp.textContent=t('openApp',{app:entry.app.name});
    row.connectionTitle.textContent=t('connection');

  function renderOffers(row) {

      if(!item) {const box=node('div','offer'),label=node('p'),description=node('p','muted');box.append(label,description);
        const attach=action(box,row,'attach','attach',()=>({integration:row.entry.id,offerID:offer.offerID}));
        item={box,label,description,attach};row.offers.set(offer.offerID,item);row.offersList.append(box);}
      item.offer=offer;offerText(item);
      item.attach.disabled=offer.protocol!=='ok' || !context?.sessionId || state?.state!=='ok' || state?.plugin?.runtime!=='active' || state?.activation.effective==='disabled'
        || state?.status?.host?.state==='unsupported' || state?.attachment.state!=='none' || catalog?.state==='unavailable';
    }

  }
  function offerText(item) {

  }
  function render() {

    document.title=t('heading');$('heading').textContent=t('heading');$('refresh').setAttribute('aria-label',t('refresh'));$('preview').textContent=t('preview');
    if(noticeKey)$('notice').textContent=t(noticeKey);

      renderRow(row,entry,state);

      position++;

  async function refresh() {

        try {const hosts=await api.bundles.hosts({integration:row.entry.id});if(mine!==epoch)return;row.hosts=hosts;}catch {row.hosts=undefined;}

  });
})();
