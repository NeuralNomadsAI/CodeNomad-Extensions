<meta name="viewport" content="width=device-width, initial-scale=1">
<title></title>
<style>
  :root { color-scheme:light; --bg:#f7f8fa; --surface:#edf0f4; --ink:#232a36; --muted:#526074; --line:#a9b3c2; --focus:#265b9f; --chip-radius:3px; font:13px system-ui,sans-serif; }
  :root[data-appearance=dark] { color-scheme:dark; --bg:#1d2430; --surface:#252f3d; --ink:#e0e7f1; --muted:#b2bed0; --line:#67768b; --focus:#83b6ef; }
  * { box-sizing:border-box; border-radius:0; }
  html,body { background:var(--bg); color:var(--ink); }
  body { margin:0; padding:12px; overflow-wrap:anywhere; }
  [hidden] { display:none !important; }
  header,.row,.scopes { display:flex; align-items:center; flex-wrap:wrap; gap:8px; }
  header { margin-bottom:8px; }
  header>div { flex-basis:100%; }
  h1,h2,h3,p { margin:0; }
  h1,h2 { font-size:13px; font-weight:600; }
  h3 { font-size:12px; }
  header h1 { flex:1; }
  button,select { min-height:30px; padding:5px 8px; border:1px solid var(--line); background:var(--surface); color:inherit; font:inherit; cursor:pointer; }
  button:focus-visible,select:focus-visible,input:focus-visible { outline:2px solid var(--focus); outline-offset:2px; }
  button:disabled,button[aria-disabled=true] { opacity:.6; cursor:default; }
  .muted,dt { color:var(--muted); }
  p { line-height:1.5; }
  #catalog,#notice,#preview { margin-bottom:10px; }
  #notice:empty { display:none; }
  #notice { padding:8px; border:1px solid var(--line); }
  .integration { border:1px solid var(--line); margin-bottom:10px; }
  .integration-heading { display:flex; align-items:center; gap:8px; padding-inline-end:8px; }
  .integration-heading h2 { flex:1; min-width:0; }
  .docs-address { direction:ltr; unicode-bidi:isolate; text-align:start; }
  .docs-status { margin:0 10px 10px; }
  .info { min-width:30px; font-style:italic; font-family:Georgia,serif; }
  .info-text { margin:0 10px 10px; padding:8px; background:var(--surface); display:grid; gap:4px; }
  .disclosure { display:flex; gap:8px; flex-wrap:wrap; align-items:center; text-align:start; border:0; width:100%; padding:10px; background:var(--bg); }
  .disclosure::before { content:'▸'; }
  .disclosure[aria-expanded=true]::before { content:'▾'; }
  .name { flex:1; min-width:120px; }
  .badge-shape { border:1px solid var(--line); border-radius:var(--chip-radius); padding:1px 5px; font-size:11px; font-weight:400; }
  .body { border-top:1px solid var(--line); padding:10px; display:grid; gap:14px; }
  .group { display:grid; gap:8px; }
  dl { display:grid; grid-template-columns:minmax(80px,auto) minmax(0,1fr); gap:4px 10px; margin:0; }
  dd { margin:0; }
  .scope { display:flex; flex-wrap:wrap; gap:8px; align-items:center; padding:8px; background:var(--surface); }
  .scope label { flex:1; display:flex; align-items:center; gap:6px; min-width:140px; }
  input { accent-color:var(--focus); }
  .offers { display:grid; gap:8px; }
  .offer { display:grid; gap:6px; border-inline-start:2px solid var(--line); padding-inline-start:8px; }
  .offer button { justify-self:start; }
  @media(max-width:359px) { body { padding:8px; } dl { grid-template-columns:1fr; } dd { margin-bottom:4px; } .scope { align-items:stretch; } }
</style>
<header><h1 id="heading"></h1><button id="refresh" type="button">↻</button>
<div>
<p id="summary" class="muted"></p>
<p id="catalog" class="muted"></p>
<p id="preview" class="muted"></p>
</div></header>
<p id="notice" role="status" aria-live="polite" aria-atomic="true"></p>
<main id="integrations" aria-labelledby="heading"></main>
