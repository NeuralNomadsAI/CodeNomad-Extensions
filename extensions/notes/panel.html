<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root { color-scheme: light; --bg:#f7f8fa; --tile:#edf0f4; --ink:#232a36; --muted:#626e80; --line:#cdd4df; --focus:#336cb7; --danger:#b3261e; font:13px system-ui,sans-serif; }
  :root[data-appearance=dark] { color-scheme:dark; --bg:#1d2430; --tile:#252f3d; --ink:#e0e7f1; --muted:#a1aec0; --line:#3b485c; --focus:#83b6ef; --danger:#f2b8b5; }
  * { box-sizing:border-box; border-radius:0; }
  html, body { height:100%; background:var(--bg); }
  body { margin:0; padding:12px; color:var(--ink); display:flex; flex-direction:column; gap:8px; }
  button, textarea { font:inherit; color:inherit; }
  button { border:1px solid var(--line); background:transparent; min-height:28px; padding:4px 8px; cursor:pointer; }
  button:focus-visible, textarea:focus-visible, .preview:focus-visible { outline:2px solid var(--focus); outline-offset:2px; }
  button:disabled { opacity:.5; cursor:default; }
  [role=tablist] { display:flex; border:1px solid var(--line); flex:none; }
  [role=tab] { flex:1 1 0; min-width:0; border:0; color:var(--muted); overflow-wrap:anywhere; }
  [role=tab] + [role=tab] { border-inline-start:1px solid var(--line); }
  [role=tab][aria-selected=true] { background:var(--tile); color:var(--ink); font-weight:600; }
  [role=tabpanel] { flex:1; min-height:0; display:flex; flex-direction:column; gap:8px; }
  [hidden] { display:none !important; }
  textarea { flex:1; min-height:120px; width:100%; resize:none; padding:8px; border:1px solid var(--line); background:transparent; line-height:1.5; }
  .bar { display:flex; flex-wrap:wrap; align-items:center; gap:8px; flex:none; }
  /* Its own row when the panel is too narrow for it beside the buttons. */
  .status { flex:1 1 10em; min-width:0; color:var(--muted); font-size:12px; }
  p.status { flex:none; margin:0; line-height:1.5; }
  .trash { display:inline-flex; align-items:center; justify-content:center; min-width:28px; padding:4px; color:var(--muted); }
  .trash svg { width:16px; height:16px; }
  .trash:hover { color:var(--danger); }
  .trash[data-armed] { color:var(--danger); border-color:var(--danger); padding:4px 8px; font-weight:600; }
  ul { list-style:none; margin:0; padding:0; overflow:auto; }
  li { display:flex; align-items:flex-start; gap:4px; border-inline-start:2px solid transparent; }
  li + li { border-top:1px solid var(--line); }
  li.current { border-inline-start-color:var(--focus); }
  .item { flex:1; min-width:0; }
  .note { width:100%; display:block; padding:8px 4px 0; border:0; text-align:start; }
  .item:hover { background:var(--tile); }
  li .trash { margin-top:6px; }
  .title { display:block; font-weight:600; overflow-wrap:anywhere; }
  .meta { display:block; margin-top:2px; color:var(--muted); font-size:11px; }
  .preview { display:-webkit-box; -webkit-line-clamp:3; -webkit-box-orient:vertical; overflow:hidden; padding:4px 4px 8px; white-space:pre-wrap; overflow-wrap:anywhere; cursor:pointer; }
  .preview[data-expanded] { display:block; }
</style>

  let armed = null;

  const session = () => context?.sessionId && context.sessionId !== 'info' ? context.sessionId : null;
  const say = (element, index) => { shown[element] = index; $(element).textContent = index === undefined ? '' : words[index]; };

  function tabs() {
    const counts = notes && { project: notes.filter(note => !note.orphan).length, orphans: notes.filter(note => note.orphan).length };

  // Session note: read-only until its first read, saved shortly after typing stops and on blur.
  async function read() {
    $('noSession').hidden = Boolean(session());
    for (const id of ['text', 'sessionBar']) $(id).hidden = !session();
    if (!session()) return;
    const started = epoch, ticket = ++reads;
    try {
      const note = await api.notes.get();
      if (ticket !== reads) return;
      if (dirty || epoch !== started) { behind = true; return; }
      behind = false;
      revision = note?.revision ?? 0; saved = note?.text ?? '';
      const replaced = $('text').value !== saved;
      if (replaced) { $('text').value = saved; remote++; }
      $('text').readOnly = false;
      // An unchanged note keeps the status shown (an insertion refusal, for instance).
      if (replaced || shown.saved === undefined || shown.saved === 19) say('saved', saved ? 4 : undefined);

  async function write() {
    const text = $('text').value;
    if (text === saved) { if ($('text').value === saved) { dirty = false; say('saved', saved ? 4 : undefined); if (behind) read(); } return; }

        // (three tries; a busier note keeps the text here for the next save).

  // Project and orphan lists: every note of the project, newest first. A note that moves between
  // pages (another window saved it) restarts the scan; after three, duplicates are dropped.
  async function list() {
    const run = ++listing;
    let all = [];
    try {
      for (let attempt = 0; attempt < 3; attempt++) {
        const seen = new Set();
        let cursor, repeated = false;
        all = [];

          if (run !== listing) return;
          for (const note of page.notes) {

            else { seen.add(note.sessionID); all.push(note); }

  function ago(time) {
    const format = new Intl.RelativeTimeFormat(context?.locale || 'en', { numeric: 'auto' }), seconds = (time - Date.now()) / 1000;

    say('listStatus', listFailed ? 19 : notes && !visible.length ? (orphans ? 12 : 11) : undefined);

      const row = document.createElement('li'), item = document.createElement('div'), button = document.createElement('button'), trash = document.createElement('button');

      meta.className = 'meta'; meta.title = new Date(note.updated).toLocaleString(context?.locale || 'en');

      preview.className = 'preview'; preview.dir = 'auto'; preview.textContent = note.text;
      preview.id = `preview-${note.sessionID.replace(/[^\w-]/g, '_')}`;

        button.onclick = () => {
          // A conversation that cannot be opened from here still shows its whole note.
          api.notes.open(note.sessionID).then(result => { if (!result?.opened) { say('listStatus', 24); show(true); } }, () => say('listStatus', 19));
          if (current) { select('session'); $('text').focus(); }
        };
      }
      trash.type = 'button'; trash.className = 'trash';
      confirming(trash, async () => {
        const index = [...$('notes').children].indexOf(row);
        const result = await api.notes.delete(note.sessionID, note.revision).catch(() => undefined);
        if (current) read();
        await list();
        if (result?.status !== 'deleted') say('listStatus', result ? 23 : 19);
        // The row is gone: the keyboard moves to its neighbour, else to the tab.
        if (!document.activeElement || document.activeElement === document.body) {
          const rows = $('notes').children;
          (rows[Math.min(index, rows.length - 1)]?.querySelector('.note') ?? $(view)).focus();
        }
      }, { version: () => note.revision, key: `row:${note.sessionID}`, label: note.title || words[14], stale: async () => { await list(); say('listStatus', 23); } });
      row.append(item, trash);
      return row;
    }));
    // An empty panel stays reachable by keyboard.
    $('listView').tabIndex = visible.length ? -1 : 0;
    if (!focus) return;
    const after = [...$('notes').children], row = after.find(item => item.dataset.session === focus.id);
    // The focused note went away (deleted, here or elsewhere): its neighbour, else the tab.
    const target = row ? row.querySelector(focus.trash ? '.trash' : '.note') : after[Math.min(focus.index, after.length - 1)]?.querySelector('.note') ?? $(view);
    target.focus({ preventScroll: true });
  }

  // Delete: the first click arms one button, a second within 3 s confirms, unless the note's `version`
  // changed meanwhile (then `stale` says so). A rebuilt row keeps the armed state of its note.
  function disarm() { if (!armed) return; clearTimeout(armed.timer); const { idle } = armed; armed = null; idle(); }
  function confirming(button, run, { version = () => 0, key = '', label = '', stale = () => {} } = {}) {
    const name = text => label ? `${text} — ${label}` : text;
    const idle = () => { delete button.dataset.armed; button.innerHTML = ICON; button.setAttribute('aria-label', name(words[9])); button.title = name(words[9]); };
    const arm = () => { button.dataset.armed = '1'; button.textContent = words[10]; button.setAttribute('aria-label', name(words[10])); };
    // A held key repeats: only distinct presses arm and confirm.
    button.onkeydown = event => { if (event.repeat && (event.key === 'Enter' || event.key === ' ')) event.preventDefault(); };
    button.onclick = () => {
      if (armed?.key === key) { const current = armed.version === version(); disarm(); if (current) run(); else stale(); return; }
      disarm();
      armed = { key, version: version(), idle, timer: setTimeout(disarm, 3000) };
      arm();
    };
    button.relabel = () => armed?.key === key ? arm() : idle();
    if (armed?.key === key) { armed.idle = idle; arm(); } else idle();
  }

  VIEWS.forEach(id => { $(id).onclick = () => select(id); });
  document.querySelector('[role=tablist]').onkeydown = event => {
    const step = { ArrowRight: 1, ArrowLeft: -1 }[event.key], edge = { Home: VIEWS[0], End: VIEWS[2] }[event.key];
    if (!step && !edge) return;
    event.preventDefault();
    const rtl = document.documentElement.dir === 'rtl', next = edge ?? VIEWS[(VIEWS.indexOf(view) + (rtl ? -step : step) + 3) % 3];
    select(next); $(next).focus();
  };
  // Another window, a deleted conversation or a reconnect: read both again.
  // A draft that could not be saved (a connection outage) is saved again then.
  api.notes.onChanged(() => { clearTimeout(changed); changed = setTimeout(() => { if (dirty) { behind = true; save(); } else read(); list(); }, 150); });
  api.onContext(value => {
    const first = !context; context = value;
    words = translations[value.locale.split('-')[0]] || translations.en;
    document.documentElement.lang = value.locale; document.documentElement.dir = value.locale.startsWith('he') ? 'rtl' : 'ltr';
    document.documentElement.dataset.appearance = value.appearance;
    for (const [variable, key] of Object.entries({ '--bg':'background', '--tile':'surface', '--ink':'text', '--muted':'muted', '--line':'border', '--focus':'focus' })) {
      const color = value.colors?.[key]; if (color && CSS.supports('color', color)) document.documentElement.style.setProperty(variable, color);
    }
    document.querySelector('[role=tablist]').setAttribute('aria-label', words[22]);
    $('text').placeholder = words[3]; $('text').setAttribute('aria-label', words[22]);
    $('insert').textContent = words[8]; $('noSession').textContent = words[7];
    say('saved', shown.saved);
    $('trash').relabel(); controls(); tabs(); render();
    if (first) { read(); list(); }
  });
})();
</script>
