<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root { color-scheme: light; --bg:#f7f8fa; --tile:#edf0f4; --ink:#232a36; --muted:#626e80; --line:#cdd4df; --focus:#336cb7; --warn:#b7791f; font:13px system-ui,sans-serif; }
  :root[data-appearance=dark] { color-scheme:dark; --bg:#1d2430; --tile:#252f3d; --ink:#e0e7f1; --muted:#a1aec0; --line:#3b485c; --focus:#83b6ef; --warn:#d69e2e; }
  * { box-sizing:border-box; border-radius:0; }
  html, body { background:var(--bg); }
  body { margin:0; padding:12px; color:var(--ink); overflow-wrap:anywhere; }
  [hidden] { display:none !important; }
  .bar { display:flex; align-items:center; gap:8px; margin-bottom:10px; flex-wrap:wrap; }
  h1 { font-size:13px; margin:0; font-weight:600; }
  h2, h3 { font-size:12px; margin:0; font-weight:600; }
  h3 { color:var(--muted); font-weight:500; }
  #where { flex:1; min-width:0; color:var(--muted); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  label.turns { display:flex; align-items:center; gap:6px; color:var(--muted); }
  button, select, summary { border:1px solid var(--line); background:transparent; color:inherit; min-height:28px; padding:4px 8px; cursor:pointer; font:inherit; }
  select { background:var(--tile); }
  button.primary { background:var(--focus); border-color:var(--focus); color:var(--bg); }
  button:focus-visible, select:focus-visible, summary:focus-visible { outline:2px solid var(--focus); outline-offset:2px; }
  button:disabled { opacity:.5; cursor:default; }
  p { margin:0; line-height:1.45; }
  .muted { color:var(--muted); }
  .row { display:flex; flex-wrap:wrap; gap:6px; align-items:center; }
  .note { border:1px solid var(--line); border-inline-start:3px solid var(--warn); padding:8px; margin-bottom:8px; }
  .card { border:1px solid var(--line); border-inline-start:3px solid var(--focus); padding:10px; margin-bottom:12px; display:grid; gap:8px; }
  .ready { display:flex; flex-wrap:wrap; gap:4px 12px; color:var(--muted); font-size:12px; }
  section { margin-bottom:12px; display:grid; gap:6px; }
  #notice:empty, #status:empty { display:none; }
  #notice { border:1px solid var(--line); padding:6px 8px; margin-bottom:10px; }
  details.gens > summary { list-style:none; border:0; padding:0; min-height:0; font-weight:600; font-size:12px; }
  details.gens > summary::-webkit-details-marker { display:none; }
  details.gens > summary::before { content:'▸ '; color:var(--muted); }
  details.gens[open] > summary::before { content:'▾ '; }
  .gens ul { list-style:none; margin:6px 0 0; padding:0; display:grid; gap:6px; }
  .gen { border:1px solid var(--line); padding:6px 8px; display:grid; gap:4px; }
  .gen[data-state=failed], .gen[data-state=cancelled], .gen[data-state=unknown] { border-inline-start:3px solid var(--warn); }
  .gen small { color:var(--muted); font-size:11px; }
  .gen > button { justify-self:start; }
  .prompt { white-space:pre-wrap; max-height:6.6em; overflow:auto; font-size:12px; }
  .tools { display:flex; align-items:center; gap:8px; }
  #count { flex:1; color:var(--muted); font:11px ui-monospace,monospace; }
  /* One column in a narrow panel (S11), two from phone width (S12), three when wide. */
  .grid { display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:8px; }
  .tile { padding:0; text-align:start; min-width:0; overflow:hidden; }
  .tile[aria-pressed=true] { border-color:var(--focus); box-shadow:inset 0 0 0 2px var(--focus); }
  .preview, .big { display:flex; align-items:center; justify-content:center; aspect-ratio:1; background:var(--tile); overflow:hidden; color:var(--muted); font-size:11px; text-align:center; }
  .preview img, .big img { width:100%; height:100%; object-fit:contain; }
  .caption { display:block; padding:6px 8px; }
  .caption span { display:block; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .badge { display:block; margin-top:2px; color:var(--muted); font-size:10px; }
  #selection { border:1px solid var(--line); padding:8px; margin-bottom:12px; display:grid; gap:8px; }
  .pair { display:grid; grid-template-columns:1fr 1fr; gap:8px; }
  #selection > figure .big { max-height:40vh; }
  figure { margin:0; min-width:0; display:grid; gap:6px; }
  figcaption { font-size:12px; }
  .sizes { display:flex; align-items:flex-end; gap:8px; color:var(--muted); font-size:11px; }
  .sizes img { background:var(--tile); object-fit:contain; }
  dl { display:grid; grid-template-columns:auto 1fr; gap:4px 8px; margin:0; font-size:12px; }
  dt { color:var(--muted); }
  dd { margin:0; min-width:0; }
  .chips { display:flex; flex-wrap:wrap; gap:4px; }
  .chips button { min-height:24px; padding:2px 6px; font-size:12px; }
  details.more > summary { list-style:none; display:inline-block; }
  details.more > summary::-webkit-details-marker { display:none; }
  details.more[open] > .row { margin-top:6px; }
  .widen { display:none; }
  footer { display:flex; justify-content:center; margin-top:8px; }
  dialog { width:calc(100% - 16px); max-width:none; max-height:calc(100% - 16px); padding:12px; border:1px solid var(--line); background:var(--bg); color:var(--ink); }
  dialog::backdrop { background:#0009; }
  dialog .bar { position:sticky; top:0; background:var(--bg); }
  #viewTitle { flex:1; min-width:0; }
  #full img { display:block; width:100%; height:auto; object-fit:contain; }
  @media (min-width:360px) { details.more > summary { display:none; } details.more[open] > .row { margin-top:0; } }
  @media (max-width:559px) { .grid { grid-template-columns:repeat(2,minmax(0,1fr)); } }
  @media (max-width:359px) { .grid, .pair { grid-template-columns:minmax(0,1fr); } .widen { display:block; } }
  @media (max-width:480px) { dialog { width:100%; height:100%; max-height:100%; margin:0; } }
</style>
<header class="bar"><h1 id="heading">Design</h1><span id="where"></span>

<p id="notice" role="status" aria-live="polite"></p>
<div id="notes"></div>
<div id="card" class="card" hidden></div>
<section id="shortcuts" hidden><h2 id="startFrom"></h2><div class="row" id="recipes"></div></section>
<details id="gens" class="gens" hidden><summary id="gensTitle"></summary><ul id="genList"></ul></details>
<section id="table" aria-labelledby="galleryTitle">

  <p id="status" role="status"></p>
  <div id="selection" hidden></div>
  <div id="series"></div>
  <footer><button id="older" type="button" hidden></button></footer>
</section>
<dialog id="viewer" aria-labelledby="viewTitle"><div class="bar"><strong id="viewTitle"></strong><button id="close" type="button"></button></div><div id="full"></div></dialog>

 "R":{"app-icon":"应用图标","logo":"标志","illustration":"插画","ui-mockup":"界面原型","banner":"横幅","free":"自由"},"D":{"minimal":"极简","friendly":"亲和","technical":"技术","editorial":"编辑","bold":"大胆"}}

<script>
(() => {
  const $ = id => document.getElementById(id), api = window.codenomad, viewer = $('viewer');
  const T = JSON.parse($('i18n').textContent);
  // Shortcut identifiers known to each Design content version (skills `design-*`).
  const RECIPES = ['app-icon','logo','illustration','ui-mockup','banner','free'], DIRECTIONS = ['minimal','friendly','technical','editorial','bold'];
  const CONTENT = { 1: { recipes:RECIPES, directions:DIRECTIONS } };
  // ponytail: Q-O1 starting value; past it "New Images conversation" is emphasized.
  const NEW_CONVERSATION_AFTER = 20, SLOTS = 4, THUMB_SLOTS = 2, CACHED_THUMBS = 96, EMPTY_PAGES = 8;
  const narrow = matchMedia('(max-width: 359px)');
  let words = T.en, locale = 'en', context = null, epoch = 0, prefsRead = false, perTurn = 3;
  let status = null, conv = null, entries = [], cursor = null, galleryState = 'idle';
  let loading = false, reloadAgain = false, statusBusy = false, statusAgain = false;
  let selection = [], comparing = false, viewIndex = -1, viewRequest = 0, fullUrl = null;
  const thumbs = new Map(), inflight = new Map(), failed = new Set();
  const say = (key, vars = {}) => String(words[key] ?? T.en[key]).replace(/\{(\w+)\}/g, (match, name) => name in vars ? String(vars[name]) : match);
  const el = (tag, className, text) => { const node = document.createElement(tag); if (className) node.className = className; if (text !== undefined) node.textContent = text; return node; };
  const keyOf = target => [target.messageID, target.part, target.index ?? '', target.digest].join('\u0000');
  const images = () => entries.filter(entry => entry.kind === 'image');
  const isImages = () => conv?.displayedIsImages === true;
  const canPrefill = () => Boolean(api.composer) && isImages();
  const referenceable = entry => entry.origin === 'proven' && entry.label !== null;
  // A file name can never become a `{{n}}` marker of the request.
  const named = entry => String(entry.label ?? '').replace(/[{}]/g, '');
  const when = (time, options) => { try { return new Intl.DateTimeFormat(locale, options).format(time); } catch { return new Date(time).toISOString(); } };

  // Every request shares the frame's four bridge slots, so none is ever refused.
  let active = 0; const waiting = [];
  function call(run) {
    return new Promise((resolve, reject) => {
      const start = () => { active++; Promise.resolve().then(run).then(resolve, reject).finally(() => { active--; waiting.shift()?.(); }); };
      if (active < SLOTS) start(); else waiting.push(start);

  function blobUrl(data) {
    const raw = atob(data.uri.slice(data.uri.indexOf(',') + 1));
    return URL.createObjectURL(new Blob([Uint8Array.from(raw, c => c.charCodeAt(0))], { type:data.mime }));
  }
  // Thumbnails: at most two reads at a time, only for wanted tiles, kept in a small
  // per-mount cache (targets carry their content digest) and released with it.
  let thumbActive = 0; const thumbQueue = [];
  function remember(key, url) {
    thumbs.set(key, url);
    while (thumbs.size > CACHED_THUMBS) { const [oldest, old] = thumbs.entries().next().value; thumbs.delete(oldest); URL.revokeObjectURL(old); }
  }
  function thumb(entry, wanted = () => true) {
    const key = keyOf(entry.target);
    if (thumbs.has(key)) { const url = thumbs.get(key); thumbs.delete(key); thumbs.set(key, url); return Promise.resolve(url); }
    if (failed.has(key)) return Promise.resolve(null);
    const queued = inflight.get(key);
    if (queued) { queued.wants.push(wanted); return queued.promise; }
    const job = { wants:[wanted], at:epoch }; job.promise = new Promise(resolve => { job.resolve = resolve; });
    inflight.set(key, job); thumbQueue.push(() => runThumb(key, entry.target, job)); pumpThumbs();
    return job.promise;
  }
  function pumpThumbs() { while (thumbActive < THUMB_SLOTS && thumbQueue.length) thumbQueue.shift()(); }
  function runThumb(key, target, job) {
    if (job.at !== epoch || !job.wants.some(wanted => wanted())) { inflight.delete(key); job.resolve(undefined); return; }
    thumbActive++;
    call(() => api.images.read(target, { thumbnail:true })).then(data => {
      if (job.at !== epoch) return undefined;
      if (data?.status !== 'asset') { failed.add(key); return null; }
      const url = blobUrl(data); remember(key, url); return url;
    }, () => { if (job.at !== epoch) return undefined; failed.add(key); return null; })
      .then(url => { inflight.delete(key); job.resolve(url); })
      .finally(() => { thumbActive--; pumpThumbs(); });
  }
  function picture(entry, image, fallback) {
    const at = epoch;
    thumb(entry).then(url => {
      if (at !== epoch || !image.isConnected) return;
      if (url) image.src = url; else if (url === null && fallback) fallback.textContent = say('preview');
    });
  }
  const observer = new IntersectionObserver(changes => {
    for (const change of changes) { change.target.visible = change.isIntersecting; if (change.isIntersecting && !change.target.loaded) loadTile(change.target); }
  });
  function loadTile(tile) {
    tile.loaded = true; const at = epoch;
    thumb(tile.entry, () => tile.visible && tile.isConnected).then(url => {
      if (at !== epoch || !tile.isConnected) return;
      if (url === undefined) { tile.loaded = false; if (tile.visible) loadTile(tile); return; }
      if (url === null) { tile.preview.textContent = say('preview'); return; }
      const image = new Image(); image.alt = ''; image.src = url; tile.preview.replaceChildren(image);
    });
  }

  function setNotice(text) { $('notice').textContent = text; }
  async function prefill(text, refs) {
    setNotice('');
    try {
      const result = await call(() => api.composer.prefill(refs ? { text, refs } : { text }));
      setNotice(say({ added:'added', busy:'busy', 'no-session':'noSessionPrefill', 'too-long':'tooLong', invalid:'invalid' }[result] ?? 'failed'));
    } catch { setNotice(say('failed')); }
  }
  async function openConversation(mode) {
    setNotice('');
    try {
      const result = await call(() => mode === 'new' ? api.conversation.startNew() : api.conversation.open());
      if (!result?.opened) setNotice(say('openFailed'));
    } catch { setNotice(say('openFailed')); }
  }
  function button(text, onclick, className) { const node = el('button', className, text); node.type = 'button'; node.onclick = onclick; return node; }

  function renderStatus() {
    $('where').textContent = !context?.sessionId ? say('whereNone') : say(isImages() ? 'whereImages' : 'whereOther');
    $('turnsBox').hidden = !canPrefill();
    const notes = [];
    if (status) {
      if (status.designAgent === 'absent') notes.push('s2'); else if (status.designAgent === 'user') notes.push('s2u');
      if (status.generation === 'disabled') notes.push('s3'); else if (status.generation === 'unsupported') notes.push('s3x');
      if (status.imageModels === false) notes.push('s4');
      if (status.chatModelSeesImages === false) notes.push('s14');
    }
    if (conv?.gitExclusion === 'unavailable') notes.push('s17');
    // Hints only: settings, help, dock and width stay host actions the user takes.
    $('notes').replaceChildren(...notes.map(key => { const note = el('p', 'note', say(key)); note.dataset.state = key; note.setAttribute('role', 'note'); return note; }));
    renderCard(); renderShortcuts();
  }
  function renderCard() {
    const card = $('card'); card.replaceChildren(); card.hidden = !api.conversation || !conv;
    if (card.hidden) return;
    const startNew = button(say('newConversation'), () => openConversation('new'));
    if (isImages()) {
      const many = images().length > NEW_CONVERSATION_AFTER;
      if (many) { startNew.className = 'primary'; card.append(el('p', 'muted', say('newHint'))); }
      card.dataset.state = 'images'; card.append(el('div', 'row')); card.lastChild.append(startNew); return;
    }
    if (conv.lookup === 'absent') {
      card.dataset.state = 's1';
      const ready = el('p', 'ready');
      if (status) ready.append(el('span', '', say(status.generation === 'available' ? 'readyGen' : 'readyGenOff')), el('span', '', say(status.imageModels ? 'readyModels' : 'readyNoModels')),
        el('span', '', say({ present:'readyAgent', user:'readyUserAgent' }[status.designAgent] ?? 'readyNoAgent')));
      card.append(el('h2', '', say('s1Title')), el('p', '', say('s1Body')), ready, el('div', 'row'));
      card.lastChild.append(button(say('s1Start'), () => openConversation('open'), 'primary'));
    } else if (conv.lookup === 'found') {
      card.dataset.state = 'found';
      const date = conv.lastUsed ? when(conv.lastUsed, { dateStyle:'medium' }) : '—';
      card.append(el('p', '', conv.imageCount === null ? say('foundNoCount', { date }) : say('found', { count:conv.imageCount, date })), el('div', 'row'));
      card.lastChild.append(button(say('open'), () => openConversation('open'), 'primary'), startNew);
    } else {
      card.dataset.state = 's1u';
      card.append(el('p', '', say('s1u')), el('div', 'row'));
      card.lastChild.append(button(say('retryCheck'), () => refreshStatus()));
    }
  }
  function known() {
    if (!status || status.designAgent === 'absent') return { recipes:[], directions:[] };
    if (status.designAgent === 'user') return CONTENT[1];
    const versions = Object.keys(CONTENT).map(Number).filter(version => version <= (status.contentVersion ?? 0));
    return versions.length ? CONTENT[Math.max(...versions)] : { recipes:[], directions:[] };
  }
  function renderShortcuts() {
    const recipes = canPrefill() ? known().recipes : [];
    $('shortcuts').hidden = !recipes.length;
    $('recipes').replaceChildren(...recipes.map(id => button(words.R?.[id] ?? T.en.R[id],
      () => prefill(say('recipeText', { recipe:words.R?.[id] ?? T.en.R[id], id, count:perTurn })))));
  }

  function generationState(entry, proven) {
    if (entry.tool === 'streaming' || entry.tool === 'running') return 'gPreparing';
    if (entry.tool === 'error') return 'gFailed';
    if (entry.tool !== 'completed') return 'gUnknown';
    return { completed:proven.has(entry.key) ? 'gDone' : 'gNoRead', error:'gFailed', cancelled:'gCancelled', unknown:'gLaunched' }[entry.outcome] ?? 'gUnknown';
  }
  // Retry names its own generation as text, never as a reference: its time, and its
  // prompt when the host shows it (braces removed so it can never become a marker).
  function retryRequest(entry) {
    const time = entry.time ? when(entry.time, { dateStyle:'short', timeStyle:'short' }) : '—';
    const prompt = Array.from(String(entry.prompt ?? '').replace(/[{}`]/g, '').replace(/\s+/g, ' ').trim());
    if (!prompt.length) return say('retryText', { time, count:perTurn });
    return say('retryPromptText', { time, prompt:prompt.length > 120 ? prompt.slice(0, 119).join('') + '…' : prompt.join(''), count:perTurn });
  }
  function renderGenerations() {
    const generations = entries.filter(entry => entry.kind === 'generation');
    const proven = new Set(images().filter(entry => entry.generationKey).map(entry => entry.generationKey));
    const box = $('gens'), wasHidden = box.hidden;
    box.hidden = !generations.length;
    $('gensTitle').textContent = say('generations', { count:generations.length });
    let attention = false;
    $('genList').replaceChildren(...generations.map(entry => {
      const state = generationState(entry, proven), item = el('li', 'gen');
      item.dataset.state = { gPreparing:'preparing', gFailed:'failed', gUnknown:'unknown', gDone:'done', gNoRead:'no-read', gCancelled:'cancelled', gLaunched:'launched' }[state];
      if (state !== 'gDone') attention = true;
      const head = el('div', 'row'); head.append(el('strong', '', say(state)));
      if (entry.time) head.append(el('small', '', when(entry.time, { timeStyle:'short' })));
      if (entry.model) head.append(el('small', '', entry.model));
      item.append(head);
      if (entry.prompt) item.append(el('p', 'prompt', entry.prompt + (entry.promptTruncated ? ' ' + say('truncated') : '')));
      if (canPrefill() && state === 'gFailed') item.append(button(say('retry'), () => prefill(retryRequest(entry))));
      if (canPrefill() && state === 'gNoRead') item.append(button(say('askShow'), () => prefill(say('askShowText'), [entry.target])));
      return item;
    }));
    if (wasHidden && !box.hidden) box.open = attention;
  }
  // Tiles are rebuilt only when entries or the language change, never for a status read.
  function renderGallery(tiles = true) {
    renderGenerations();
    const list = images();
    if (tiles) {
      observer.disconnect();
      const groups = new Map();
      for (const entry of list) { if (!groups.has(entry.series)) groups.set(entry.series, []); groups.get(entry.series).push(entry); }
      $('series').replaceChildren(...[...groups.values()].map(group => {
        const section = el('section'), title = el('h3', '', say('series', { time:group[0].time ? when(group[0].time, { dateStyle:'short', timeStyle:'short' }) : '—' }) + ' · ' + say('imageCount', { count:group.length }));
        const grid = el('div', 'grid'); section.append(title, grid);
        for (const entry of group) grid.append(tile(entry));
        return section;
      }));
    }
    $('count').textContent = list.length ? say('imageCount', { count:list.length }) : '';
    $('status').textContent = galleryState === 'loading' ? say('loading') : galleryState === 'error' ? say('unavailable') : galleryState === 'noapi' ? say('noApi')
      : !context?.sessionId ? say('noSession') : !list.length && galleryState === 'ready' ? say(isImages() ? 'emptyImages' : 'emptyOther') : '';
    $('older').hidden = !cursor || loading;
    renderCard(); renderSelection();
  }
  function tile(entry) {
    const node = button('', () => select(keyOf(entry.target)), 'tile');
    node.dataset.key = keyOf(entry.target); node.dataset.origin = entry.origin;
    node.setAttribute('aria-pressed', String(selection.includes(node.dataset.key)));
    const preview = el('span', 'preview'), caption = el('span', 'caption');
    caption.append(el('span', '', entry.label ?? say('outside')));
    if (entry.origin !== 'proven') caption.append(el('small', 'badge', say('unverifiable')));
    node.append(preview, caption); node.entry = entry; node.preview = preview;
    observer.observe(node);
    return node;
  }
  function select(key) {
    if (!comparing) selection = selection[0] === key ? [] : [key];
    else selection = selection.includes(key) ? selection.filter(item => item !== key) : [...selection, key].slice(-2);
    renderSelection();
  }
  function figure(entry) {
    const node = el('figure'), big = el('div', 'big'), image = new Image(); image.alt = entry.label ?? say('outside');
    big.append(image); node.append(big);
    const caption = el('figcaption', '', (entry.label ?? say('outside')) + (entry.model ? ' · ' + entry.model : ''));
    const sizes = el('div', 'sizes'); sizes.append(el('span', '', say('smallSizes')));
    const small = [16, 32, 64].map(size => { const icon = new Image(size, size); icon.alt = ''; icon.dataset.size = String(size); return icon; });
    sizes.append(...small); node.append(caption, sizes);
    picture(entry, image, big);
    for (const icon of small) picture(entry, icon);
    return node;
  }
  // Lineage by opaque generation keys; a key without a loaded image is in older pages.
  function lineage(label, keys, others = 0) {
    const list = images(), dd = el('dd'), box = el('div', 'chips');
    for (const key of keys) {
      const target = list.find(entry => entry.generationKey === key);
      box.append(target ? button(target.label ?? say('outside'), () => { selection = [keyOf(target.target)]; renderSelection(); }) : el('span', 'muted', say('olderParent')));
    }
    if (others) box.append(el('span', 'muted', say('otherRefs', { count:others })));
    dd.dataset.lineage = label; dd.append(box);
    return [el('dt', '', say(label)), dd];
  }
  function renderSelection() {
    const box = $('selection'), byKey = new Map(images().map(entry => [keyOf(entry.target), entry]));
    selection = selection.filter(key => byKey.has(key));
    for (const node of document.querySelectorAll('.tile')) node.setAttribute('aria-pressed', String(selection.includes(node.dataset.key)));
    $('compare').setAttribute('aria-pressed', String(comparing));
    box.replaceChildren();
    box.hidden = !comparing && !selection.length;
    if (box.hidden) return;
    box.dataset.view = comparing ? 'compare' : 'detail';
    if (comparing) {
      if (selection.length < 2) { box.append(el('p', 'muted', say('compareHint'))); return; }
      const pair = el('div', 'pair'); pair.append(...selection.map(key => figure(byKey.get(key))));
      box.append(pair, el('p', 'widen muted', say('widen')));
      return;
    }
    const entry = byKey.get(selection[0]);
    box.append(figure(entry));
    // An unverifiable origin shows pixels only: no prompt, model or parents.
    if (entry.origin !== 'proven') box.append(el('p', 'muted', say('unverifiable')));
    const facts = el('dl');
    if (entry.origin === 'proven') {
      if (entry.prompt) facts.append(el('dt', '', say('prompt')), el('dd', 'prompt', entry.prompt + (entry.promptTruncated ? ' ' + say('truncated') : '')));
      if (entry.model) facts.append(el('dt', '', say('model')), el('dd', '', entry.model));
      if (entry.parentKeys?.length || entry.otherRefs) facts.append(...lineage('parents', entry.parentKeys ?? [], entry.otherRefs ?? 0));
      const children = images().filter(item => item.generationKey && item.generationKey !== entry.generationKey && item.parentKeys?.includes(entry.generationKey));
      if (children.length) facts.append(...lineage('children', [...new Set(children.map(item => item.generationKey))]));
    }
    if (facts.childElementCount) box.append(facts);
    const actions = el('div', 'row');
    actions.append(button(say('view'), () => view(images().indexOf(entry))));
    if (canPrefill()) {
      const usable = referenceable(entry), refs = [entry.target], label = named(entry);
      const refine = button(say('refine'), () => prefill(say('refineText', { label, count:perTurn }), refs), 'primary');
      const more = el('details', 'more'), summary = el('summary', '', '⋯'), rest = el('div', 'row');
      summary.setAttribute('aria-label', say('more')); summary.title = say('more');
      const direction = el('select'); direction.setAttribute('aria-label', say('direction'));
      for (const id of known().directions) direction.append(Object.assign(el('option', '', words.D?.[id] ?? T.en.D[id]), { value:id }));
      const apply = button(say('apply'), () => prefill(say('directionText', { direction:words.D?.[direction.value] ?? T.en.D[direction.value], id:direction.value, label, count:perTurn }), refs));
      rest.append(button(say('variants'), () => prefill(say('variantsText', { label, count:perTurn }), refs)));
      if (direction.options.length) rest.append(direction, apply);
      rest.append(button(say('save'), () => prefill(say('saveText'), refs)));
      more.append(summary, rest); more.open = !narrow.matches;
      for (const control of [refine, direction, ...rest.querySelectorAll('button')]) control.disabled = !usable;
      actions.append(refine, more);
      box.append(actions);
      if (!usable) box.append(el('p', 'muted', say('refOnlyProven')));
    } else box.append(actions);
  }

  async function page(from) {
    let result, position = from;
    // ponytail: eight empty bounded pages per gesture, as MCP Assets; Older continues.
    for (let n = 0; n < EMPTY_PAGES; n++) {

})();
